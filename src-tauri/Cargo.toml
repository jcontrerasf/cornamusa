[package]
name = "cornamusa"
description = "Cliente de correo moderno con vista de hilos tipo chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "cornamusa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cornamusa-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Same folder resolution as Tauri's app_data_dir, for the MCP bridge (runs without Tauri).
dirs = "6"

# "Abrir con…": the desktop portal shows the native application chooser.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
# Notifications sent directly so they can carry the "suppress-sound" hint, which the
# notification plugin drops (Cinnamon plays its own sound otherwise).
notify-rust = "4.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
