<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cornamusa: a post horn (corneta de posta), the classic symbol of mail. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="200" y1="220" x2="900" y2="760">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <g transform="translate(512 512) scale(0.9) translate(-550 -481)">
    <!-- horn body: thick tube from the mouthpiece (left) down and up into the bell (right) -->
    <path d="M202 440 A310 310 0 1 0 803 334 Q820 287 915 212 L755 270 L721 364 A222 222 0 1 1 290 440 Z" fill="url(#gold)"/>
    <!-- bell rim -->
    <line x1="755" y1="270" x2="915" y2="212" stroke="#f59e0b" stroke-width="34" stroke-linecap="round"/>
    <!-- mouthpiece -->
    <rect x="182" y="388" width="128" height="50" rx="18" fill="#f59e0b"/>
    <!-- coiled tube: a spiral rising from the bottom of the horn -->
    <path d="M362 640 L362 470 A150 150 0 0 1 662 470 A105 105 0 0 1 452 470 A60 60 0 0 1 572 470" fill="none" stroke="url(#gold)" stroke-width="52" stroke-linecap="round"/>
  </g>
</svg>
